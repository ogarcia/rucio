[package]
name        = "rucio-bootstrap"
description = "Stable Rucio DHT bootstrap node"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
repository.workspace  = true

[[bin]]
name = "rucio-bootstrap"
path = "src/main.rs"

[features]
# The lean, headless flavour: record periodic resource-usage snapshots (peers,
# CPU, memory, traffic, load) into a small SQLite DB so operators can size the
# hardware a bootstrap node needs — no web, no search index. Off by default;
# recording runs by default once compiled in, disabled with `--no-stats`.
# Resource figures come from Linux /proc (NULL on other hosts).
stats = ["dep:sqlx"]

# The full node: the passive DHT indexer + keyword search site, the stats panel
# and the JSON/REST API, all served over one HTTP port. Implies `stats` (the
# panel renders resource usage) and shares its SQLite database. Off by default;
# the indexer and stats both run by default once compiled in and are turned off
# at runtime with `--no-index` / `--no-stats`.
web = [
    "stats",
    "dep:axum",
    "dep:utoipa",
    "dep:utoipa-scalar",
    "dep:serde_json",
    "dep:hex",
    "dep:urlencoding",
]

[dependencies]
rucio-net   = { path = "../rucio-net" }
rucio-core  = { path = "../rucio-core" }
libp2p      = { workspace = true }
tokio       = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }
tracing     = { workspace = true }
dirs        = { workspace = true }
serde       = { workspace = true }
toml        = { workspace = true }

# stats/web roles only (sqlx pulled by both; the rest only by `web`)
sqlx          = { workspace = true, optional = true }
axum          = { workspace = true, optional = true }
utoipa        = { workspace = true, optional = true }
utoipa-scalar = { workspace = true, optional = true }
serde_json    = { workspace = true, optional = true }
hex           = { workspace = true, optional = true }
urlencoding   = { workspace = true, optional = true }
